<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Web Lab 3 - Start Page</title>
    <h:outputStylesheet library="styles" name="style.css"/>
    <h:outputScript library="scripts" name="clock.js" target="head"/>
</h:head>
<h:body>
    <div class="container">
        <div class="header">
            <h1>Лабораторная работа #3</h1>
            <div class="student-info">
                <p><strong>Студент:</strong> Жукова Мария</p>
                <p><strong>Группа:</strong> P3232</p>
                <p><strong>Вариант:</strong> 381731</p>
            </div>
        </div>

        <div class="clock-section">
            <div id="clock-container">
                <h3>Текущее время:</h3>
                <div id="clock-display" class="clock"> </div>
            </div>
        </div>

        <div class="navigation">
            <h:link outcome="main" value="Перейти к приложению →" styleClass="nav-link"/>
        </div>

        <h:form id="testForm">
            <div class="test-container">
                <h3>Тестирование управляемого бина</h3>

                <!-- Текстовое поле -->
                <h:outputLabel for="textField" value="Текстовое поле: " />
                <h:inputText id="textField" value="#{testBean.textValue}" />

                <!-- Числовое поле -->
                <h:outputLabel for="numberField" value="Числовое поле: " />
                <h:inputText id="numberField" value="#{testBean.numberValue}" />

                <!-- Выпадающий список -->
                <h:outputLabel for="dropdown" value="Выбор: " />
                <h:selectOneMenu id="dropdown" value="#{testBean.selectedOption}">
                    <f:selectItem itemValue="option1" itemLabel="Опция 1" />
                    <f:selectItem itemValue="option2" itemLabel="Опция 2" />
                    <f:selectItem itemValue="option3" itemLabel="Опция 3" />
                </h:selectOneMenu>

                <!-- Кнопки действий -->
                <h:commandButton value="Сохранить" action="#{testBean.saveData()}" styleClass="mybutton" />
                <h:commandButton value="Показать данные" action="#{testBean.showData()}" styleClass="mybutton" />
                <h:commandButton value="Очистить" action="#{testBean.clearData()}" styleClass="mybutton" />

                <!-- Отображение результата -->
                <h:outputText value="#{testBean.resultMessage}" style="display: block; margin-top: 10px; font-weight: bold;" />
            </div>
        </h:form>

    </div>
</h:body>
</html>
