plugins {
    id 'java'
    id 'war'
    id 'org.gretty' version '4.1.0'
}

group = 'ru.uni'
version = '1.0.0'
sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    // Servlet API
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    compileOnly 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.0'

    // JSTL
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    // Для JSP компиляции
    implementation 'org.apache.tomcat:tomcat-jasper:10.1.5'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

war {
    archiveFileName = 'web.war'
}

gretty {
    httpPort = 8080
    contextPath = '/'
    servletContainer = 'tomcat10'
    jvmArgs = ['-Xdebug', '-Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=5005']

    // Автоперезагрузка при изменении кода:
//    recompileOnSourceChange = true
//    reloadOnClassChange = true
//    managedClassReload = true

    // Для избежания конфликтов портов
    inplaceMode = 'hard'
}