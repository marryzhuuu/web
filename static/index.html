<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Лабораторная работа #1</title>
    <script defer src="index.js"></script>
    <style>
        html {  /* Пример селектора элемента */
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: Arial; /* Пример наследования: дочерние элементы унаследуют свойство */
        }

        .navbar {  /* Пример селектора класса */
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .navbar .fire:hover {
            color: #FF6961;
            transition: ease 300ms;
        }

        /* Пример псевдоэлемента: "ссылка" после ссылки */
        a::after {
          content: " ↗";
        }

        #github {   /* Пример селектора id */
            text-decoration: none;
        }

        #github:hover { /* Пример псевдокласса: состояние элемента при наведении мыши */
            color: gray;
            transition: ease 300ms;
        }

        .info {
            display: flex;
            flex-direction: column;
            font-family: Sans Serif;    /* Пример каскадирования: специфичность селектора класса определяет выбор свойства */
            font-size: 1rem;
        }

        .name {
            font-size: 2rem;
        }

        .name::first-letter { /* Пример псевдоэлемента: выделение первой буквы */
            color: #3399ff;
            font-weight: bold;
        }

        .container {
            padding: 20px;
            display: flex;
            flex: 1;
            flex-direction: row;
            justify-content: space-between;
        }

        section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .buttons {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 10px;
        }

        .buttons > input {
            width: 100%;
        }

        #data-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #data-form button[type="submit"] {
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
        }

        #result-table {
            border: 1px solid #444;
            width: 100%;
            border-collapse: collapse;
        }

        #result-table th, td {
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
        }

        #error {
            color: #FF6961;
            padding: 10px;
        }

    </style>
</head>
<body>
<nav class="navbar">
    <div class="info">
        <div class="name">Жукова Мария</div>
        <div class="group">Группа: P3232</div>
        <span>Вариант: <span class="fire">381731</span></span>
    </div>
    <a href="https://github.com/marryzhuuu/web" target="_blank" id="github">GitHub</a>
</nav>
<main class="container">
    <section class="input">
        <form action="/" method="GET" id="data-form">
            <div>
                <label for="x">Введите X:</label>
                <input type="text" id="x" name="x" maxlength="8" required>
            </div>

            <div>
                <label for="y">Введите Y:</label>
                <input type="text" id="y" name="y" maxlength="8" required>
            </div>

            <fieldset>
                <legend>Выберите R:</legend>
                <div class="buttons"  id="rs">
                    <input type="button" name="r" value="1">
                    <input type="button" name="r" value="1.5">
                    <input type="button" name="r" value="2">
                    <input type="button" name="r" value="2.5">
                    <input type="button" name="r" value="3">
                </div>
            </fieldset>

            <button type="submit">Submit</button>
        </form>
        <div id="error" hidden>
        </div>
    </section>
    <section class="legend">
        <canvas id="graph" width="300" height="300"></canvas>
    </section>
    <section class="results">
        <table id="result-table">
            <tr>
                <th>X</th>
                <th>Y</th>
                <th>R</th>
                <th>Время</th>
                <th>Время выполнения</th>
                <th>Результат</th>
            </tr>
        </table>
    </section>
</main>
</body>
</html>
