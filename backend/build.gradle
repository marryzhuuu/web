plugins {
    id 'java'
    id 'war'
}

version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // Jakarta Servlet API
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Jakarta REST (JAX-RS) API - только API, реализация предоставляется WildFly
    providedCompile 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'

    // JSON
    providedCompile 'jakarta.json.bind:jakarta.json.bind-api:3.0.0'
    providedCompile 'jakarta.json:jakarta.json-api:2.1.1'
    implementation 'org.eclipse:yasson:3.0.3'
    implementation 'jakarta.json:jakarta.json-api:2.1.1'

    // JPA with Hibernate
    implementation 'org.hibernate:hibernate-core:6.2.7.Final'
    implementation 'org.postgresql:postgresql:42.6.0'

    // Security
    implementation 'org.mindrot:jbcrypt:0.4'

    providedCompile 'jakarta.platform:jakarta.jakartaee-web-api:9.1.0'

    // Security - BCrypt
    implementation 'org.mindrot:jbcrypt:0.4'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

war {
    archiveFileName = 'web.war'
}
