    providedCompile 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'

    // Для JSON обработки
    implementation 'org.glassfish:jakarta.json:2.0.1'

    // Jackson для JSON (если нужно)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'


    // Jakarta Servlet API
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Jakarta REST (JAX-RS) API
    providedCompile 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'

    // JSON-B API для компиляции
    providedCompile 'jakarta.json.bind:jakarta.json.bind-api:3.0.0'

    // JSON Processing API
    providedCompile 'jakarta.json:jakarta.json-api:2.1.1'

    // Для тестирования или если нужна реализация вне сервера приложений
    implementation 'org.eclipse:yasson:3.0.3'
    implementation 'org.glassfish:jakarta.json:2.0.1'

}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

war {
    archiveFileName = 'web.war'
}

